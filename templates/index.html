<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xử lý ảnh cơ bản</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .container { width: 80%; margin: auto; }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 300px;
            height: auto;
            border: 1px solid #ccc;
        }
        .controls { text-align: left; margin: auto; display: inline-block; }
        label { display: block; margin-top: 10px; }
        input[type=range] { width: 300px; }
        .buttons { margin-top: 20px; }
        .buttons button { padding: 6px 12px; margin: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Xử lý ảnh cơ bản</h1>
    <form id="imageForm">
        <input type="file" name="image" id="uploadInput" accept="image/*"><br><br>

        <label>Chế độ hiển thị:
            <select name="mode" id="modeSelect">
                <option value="none">Không tách</option>
                <option value="red">Kênh đỏ</option>
                <option value="green">Kênh xanh lá</option>
                <option value="blue">Kênh xanh dương</option>
                <option value="gray">Xám</option>
            </select>
        </label><br><br>

        <div class="image-container">
            <div>
                <p>Ảnh gốc</p>
                <img id="originalImage" src="" alt="">
            </div>
            <div>
                <p>Ảnh xử lý</p>
                <img id="processedImage" src="" alt="">
            </div>
        </div>

        <div class="controls">
            <label>Độ nét: <input type="range" name="sharpness" min="0" max="5" step="0.1" value="1"></label>
            <label>Độ sáng: <input type="range" name="brightness" min="0" max="200" value="100"></label>
            <label>Độ bão hòa: <input type="range" name="saturation" min="0" max="200" value="100"></label>
            <label>Độ tương phản: <input type="range" name="contrast" min="0" max="200" value="100"></label>
            <label>Màu đỏ: <input type="range" name="red" min="0" max="200" value="100"></label>
            <label>Màu xanh lá: <input type="range" name="green" min="0" max="200" value="100"></label>
            <label>Màu xanh dương: <input type="range" name="blue" min="0" max="200" value="100"></label>
        </div>

        <div class="buttons">
            <button type="button" onclick="resetImage()">Reset ảnh</button>
            <a href="/download"><button type="button">Tải xuống</button></a>
        </div>
    </form>
</div>

<script>
const form = document.getElementById('imageForm');
const uploadInput = document.getElementById('uploadInput');
const originalImage = document.getElementById('originalImage');
const processedImage = document.getElementById('processedImage');

uploadInput.addEventListener('change', () => {
    const formData = new FormData();
    formData.append('image', uploadInput.files[0]);
    formData.append('action', 'upload');

    fetch('/', {
        method: 'POST',
        body: formData
    }).then(res => res.json()).then(data => {
        originalImage.src = data.original;
        processedImage.src = data.processed;
    });
});

form.querySelectorAll('input[type=range], select').forEach(el => {
    el.addEventListener('input', () => {
        const formData = new FormData(form);
        formData.append('action', 'update');
        fetch('/', {
            method: 'POST',
            body: formData
        }).then(res => res.json()).then(data => {
            processedImage.src = data.processed + '?t=' + new Date().getTime();
        });
    });
});

function resetImage() {
    fetch('/?action=reset').then(() => location.reload());
}
</script>
</body>
</html>
